<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 128" role="img" aria-labelledby="title desc">
  <title id="title">simpleXflow</title>
  <desc id="desc">simpleXflow logo with connected process nodes, an X-shaped decision mark and an olive green wordmark.</desc>
  <defs>
    <linearGradient id="markBase" x1="12" y1="14" x2="108" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fbf4" />
      <stop offset="1" stop-color="#e7efd9" />
    </linearGradient>
    <linearGradient id="flowGreen" x1="28" y1="28" x2="99" y2="99" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8fa85d" />
      <stop offset=".55" stop-color="#5f7042" />
      <stop offset="1" stop-color="#2f451f" />
    </linearGradient>
    <linearGradient id="flowDark" x1="30" y1="31" x2="94" y2="97" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#26351f" />
      <stop offset="1" stop-color="#172416" />
    </linearGradient>
  </defs>

  <g id="mark">
    <rect x="8" y="12" width="104" height="104" rx="24" fill="url(#markBase)" />
    <rect x="8" y="12" width="104" height="104" rx="24" fill="none" stroke="#dce8cf" stroke-width="2" />

    <path d="M34 38 H53 C64 38 68 47 75 56" fill="none" stroke="url(#flowDark)" stroke-width="7" stroke-linecap="round" />
    <path d="M34 64 H54 C63 64 68 60 75 56" fill="none" stroke="url(#flowGreen)" stroke-width="7" stroke-linecap="round" />
    <path d="M34 90 H53 C64 90 68 81 75 72" fill="none" stroke="url(#flowDark)" stroke-width="7" stroke-linecap="round" />
    <path d="M75 56 L91 72 M91 56 L75 72" fill="none" stroke="#2f451f" stroke-width="8" stroke-linecap="round" />
    <path d="M92 64 H100" fill="none" stroke="#8fa85d" stroke-width="7" stroke-linecap="round" />

    <circle cx="28" cy="38" r="10" fill="#f8fbf4" stroke="#26351f" stroke-width="6" />
    <circle cx="28" cy="64" r="10" fill="#f8fbf4" stroke="#6f853d" stroke-width="6" />
    <circle cx="28" cy="90" r="10" fill="#f8fbf4" stroke="#26351f" stroke-width="6" />
    <circle cx="102" cy="64" r="5" fill="#8fa85d" />
  </g>

  <g id="wordmark">
    <text x="132" y="69" fill="#f8fbf4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="44" font-weight="760">simple</text>
    <text x="267" y="69" fill="#b8cf7b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="46" font-weight="860">X</text>
    <text x="303" y="69" fill="#f8fbf4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="44" font-weight="760">flow</text>
    <text x="135" y="94" fill="#dce8cf" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">MODEL / SIMULATE / DECIDE</text>
  </g>
</svg>

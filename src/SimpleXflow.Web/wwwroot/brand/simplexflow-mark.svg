  <path d="M35 64 H57 C68 64 73 60 80 57" fill="none" stroke="url(#green)" stroke-width="9" stroke-linecap="round" />
  <path d="M35 90 H55 C67 90 72 80 80 71" fill="none" stroke="url(#dark)" stroke-width="9" stroke-linecap="round" />
  <path d="M79 57 L96 74 M96 57 L79 74" fill="none" stroke="#2f451f" stroke-width="10" stroke-linecap="round" />
  <path d="M97 65 H107" fill="none" stroke="#95ad62" stroke-width="9" stroke-linecap="round" />

  <circle cx="28" cy="38" r="11" fill="#f8fbf4" stroke="#26351f" stroke-width="7" />
  <circle cx="28" cy="64" r="11" fill="#f8fbf4" stroke="#6f853d" stroke-width="7" />
  <circle cx="28" cy="90" r="11" fill="#f8fbf4" stroke="#26351f" stroke-width="7" />
  <circle cx="108" cy="65" r="6" fill="#95ad62" />

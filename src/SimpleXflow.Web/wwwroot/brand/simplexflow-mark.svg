<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">simpleXflow mark</title>
  <desc id="desc">A compact simpleXflow mark showing connected process nodes, an X-shaped decision and an outgoing flow.</desc>
  <defs>
    <linearGradient id="background" x1="10" y1="10" x2="118" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fbf4" />
      <stop offset="1" stop-color="#e3ecd5" />
    </linearGradient>
    <linearGradient id="green" x1="28" y1="28" x2="104" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#95ad62" />
      <stop offset=".55" stop-color="#5f7042" />
      <stop offset="1" stop-color="#2f451f" />
    </linearGradient>
    <linearGradient id="dark" x1="30" y1="32" x2="98" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#26351f" />
      <stop offset="1" stop-color="#172416" />
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#background)" />
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="#cfdcbf" stroke-width="3" />


name: Deploy container to Azure

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR image tag to deploy, for example latest or a commit SHA"
        required: true
        default: latest

permissions:
  contents: read
  id-token: write

env:
  AZURE_RESOURCE_GROUP: rg-simplexflow
  AZURE_CONTAINER_APP: ca-simplexflow
  GHCR_IMAGE: ghcr.io/symasdesign/simplexflow
  AZURE_CLIENT_ID: c84a2dc1-e98e-4946-8c68-f084e646fe10
  AZURE_TENANT_ID: 11a68f50-2c95-46d1-b23a-4f2866f69143
  AZURE_SUBSCRIPTION_ID: c3a51299-7014-4440-9741-1f6f9828b745

jobs:
  deploy:
    name: Deploy selected container image
    runs-on: ubuntu-latest

    steps:
    - name: Log in to Azure
      uses: azure/login@v2
      with:
        client-id: ${{ env.AZURE_CLIENT_ID }}
        tenant-id: ${{ env.AZURE_TENANT_ID }}
        subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy image to Container Apps
      run: |
        az containerapp update \
          --resource-group "${AZURE_RESOURCE_GROUP}" \
          --name "${AZURE_CONTAINER_APP}" \
          --image "${GHCR_IMAGE}:${{ inputs.image_tag }}"

    - name: Show live URL
      run: |
        fqdn=$(az containerapp show \
          --resource-group "${AZURE_RESOURCE_GROUP}" \
          --name "${AZURE_CONTAINER_APP}" \
          --query "properties.configuration.ingress.fqdn" \
          --output tsv)

        echo "Deployed to https://${fqdn}"

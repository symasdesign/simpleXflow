name: Deploy container to Azure

on:
  workflow_call:
    inputs:
      image_tag:
        description: "Immutable tag of the tested container image"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR image tag to deploy, for example latest or a commit SHA"
        required: true
        default: latest

permissions:
  contents: read
  id-token: write

env:
  AZURE_RESOURCE_GROUP: rg-simplexflow
  AZURE_CONTAINER_APP: ca-simplexflow
  GHCR_IMAGE: ghcr.io/symasdesign/simplexflow
  AZURE_CLIENT_ID: c84a2dc1-e98e-4946-8c68-f084e646fe10
  AZURE_TENANT_ID: 11a68f50-2c95-46d1-b23a-4f2866f69143
  AZURE_SUBSCRIPTION_ID: c3a51299-7014-4440-9741-1f6f9828b745

jobs:
  deploy:
    name: Deploy selected container image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: simplexflow-production
      cancel-in-progress: false
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}

    steps:
    - name: Check deployment target
      id: target
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [[ ! "${IMAGE_TAG}" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
          echo "::error::Invalid container image tag."
          exit 1
        fi
        if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
          current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [[ "${current_sha}" != "${IMAGE_TAG}" ]]; then
            echo "::notice::Skipping an older build because main has advanced."
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
        fi
        echo "deploy=true" >> "${GITHUB_OUTPUT}"

    - name: Log in to Azure
      if: steps.target.outputs.deploy == 'true'
      uses: azure/login@v2
      with:
        client-id: ${{ env.AZURE_CLIENT_ID }}
        tenant-id: ${{ env.AZURE_TENANT_ID }}
        subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy image to Container Apps
      if: steps.target.outputs.deploy == 'true'
      id: revision
      run: |
        revision=$(az containerapp update \
          --resource-group "${AZURE_RESOURCE_GROUP}" \
          --name "${AZURE_CONTAINER_APP}" \
          --image "${GHCR_IMAGE}:${IMAGE_TAG}" \
          --query "properties.latestRevisionName" --output tsv)
        test -n "${revision}"
        echo "name=${revision}" >> "${GITHUB_OUTPUT}"

    - name: Verify running revision and database health
      if: steps.target.outputs.deploy == 'true'
      env:
        EXPECTED_REVISION: ${{ steps.revision.outputs.name }}
      run: |
        for attempt in $(seq 1 30); do
          ready=$(az containerapp show \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${AZURE_CONTAINER_APP}" \
            --query "properties.latestReadyRevisionName" --output tsv)
          if [[ "${ready}" == "${EXPECTED_REVISION}" ]]; then
            break
          fi
          if [[ "${attempt}" == "30" ]]; then
            echo "::error::The deployed revision did not become ready."
            exit 1
          fi
          sleep 10
        done
        routing=$(az containerapp show \
          --resource-group "${AZURE_RESOURCE_GROUP}" \
          --name "${AZURE_CONTAINER_APP}" \
          --query '{mode:properties.configuration.activeRevisionsMode,traffic:properties.configuration.ingress.traffic}' \
          --output json)
        if ! jq -e --arg revision "${EXPECTED_REVISION}" \
          '.mode == "Single" or ([.traffic[]? | select(.latestRevision == true or .revisionName == $revision) | .weight] | add) == 100' \
          <<< "${routing}" > /dev/null; then
          echo "::error::The ready revision does not receive all public traffic."
          exit 1
        fi
        fqdn=$(az containerapp show \
          --resource-group "${AZURE_RESOURCE_GROUP}" \
          --name "${AZURE_CONTAINER_APP}" \
          --query "properties.configuration.ingress.fqdn" \
          --output tsv)

        for url in "https://${fqdn}/healthz/db" "https://simplexflow.ch/healthz/db"; do
          curl --fail --show-error --silent --retry 12 --retry-delay 5 \
            --retry-all-errors --max-time 30 "${url}"
          echo
        done
        echo "Deployed ${GHCR_IMAGE}:${IMAGE_TAG} to https://${fqdn}"

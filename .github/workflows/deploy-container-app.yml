name: Deploy container to Azure

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR image tag to deploy, for example latest or a commit SHA"
        required: true
        default: latest

permissions:
  contents: read

env:
  AZURE_RESOURCE_GROUP: rg-simplexflow
  AZURE_CONTAINER_APP: ca-simplexflow
  GHCR_IMAGE: ghcr.io/symasdesign/simplexflow

jobs:
  deploy:
    name: Deploy selected container image
    runs-on: ubuntu-latest

    steps:
    - name: Log in to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy image to Container Apps
      run: |
        az containerapp update \
          --resource-group "${AZURE_RESOURCE_GROUP}" \
          --name "${AZURE_CONTAINER_APP}" \
          --image "${GHCR_IMAGE}:${{ inputs.image_tag }}"

    - name: Show live URL
      run: |
        fqdn=$(az containerapp show \
          --resource-group "${AZURE_RESOURCE_GROUP}" \
          --name "${AZURE_CONTAINER_APP}" \
          --query "properties.configuration.ingress.fqdn" \
          --output tsv)

        echo "Deployed to https://${fqdn}"

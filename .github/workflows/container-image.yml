name: Build and publish container image

on:
  push:
    branches:
    - main
    - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOTNET_VERSION: 10.0.x
  BUILD_CONFIGURATION: Release
  WEB_PROJECT: src/SimpleXflow.Web/SimpleXflow.Web.csproj

jobs:
  build-test-and-publish:
    name: Build, test, and publish container
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set image name
      shell: bash
      run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/simplexflow" >> "$GITHUB_ENV"

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore
      run: dotnet restore simpleXflow.slnx

    - name: Build
      run: dotnet build simpleXflow.slnx --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

    - name: Test
      run: dotnet test simpleXflow.slnx --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --logger trx --results-directory test-results

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: container-test-results
        path: test-results/*.trx

    - name: Publish web app
      run: dotnet publish ${{ env.WEB_PROJECT }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --output publish-check

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile
        push: true
        tags: |
          ${{ env.IMAGE_NAME }}:latest
          ${{ env.IMAGE_NAME }}:${{ github.sha }}

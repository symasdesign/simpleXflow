name: Azure diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_RESOURCE_GROUP: rg-simplexflow
  AZURE_CONTAINER_APP: ca-simplexflow
  AZURE_SQL_SERVER: simplexflow-sql
  AZURE_SQL_DATABASE: simplexflow-db
  AZURE_CLIENT_ID: c84a2dc1-e98e-4946-8c68-f084e646fe10
  AZURE_TENANT_ID: 11a68f50-2c95-46d1-b23a-4f2866f69143
  AZURE_SUBSCRIPTION_ID: c3a51299-7014-4440-9741-1f6f9828b745

jobs:
  inspect:
    name: Inspect Azure Container App
    runs-on: ubuntu-latest

    steps:
    - name: Log in to Azure
      uses: azure/login@v2
      with:
        client-id: ${{ env.AZURE_CLIENT_ID }}
        tenant-id: ${{ env.AZURE_TENANT_ID }}
        subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

    - name: Show container app status
      run: |
        az containerapp show \
          --resource-group "${AZURE_RESOURCE_GROUP}" \
          --name "${AZURE_CONTAINER_APP}" \
          --query "{runningStatus:properties.runningStatus,provisioningState:properties.provisioningState,latestReadyRevisionName:properties.latestReadyRevisionName,fqdn:properties.configuration.ingress.fqdn,image:properties.template.containers[0].image}" \
          --output table

    - name: Show configured environment variable names
      run: |
        az containerapp show \
          --resource-group "${AZURE_RESOURCE_GROUP}" \
          --name "${AZURE_CONTAINER_APP}" \
          --query "properties.template.containers[0].env[].{name:name,secretRef:secretRef}" \
          --output table

    - name: Show configured secret names
      run: |
        az containerapp show \
          --resource-group "${AZURE_RESOURCE_GROUP}" \
          --name "${AZURE_CONTAINER_APP}" \
          --query "properties.configuration.secrets[].name" \
          --output table

    - name: Show container probes
      run: |
        az containerapp show \
          --resource-group "${AZURE_RESOURCE_GROUP}" \
          --name "${AZURE_CONTAINER_APP}" \
          --query "properties.template.containers[0].probes" \
          --output json

    - name: Show Azure SQL auto-pause settings
      run: |
        az sql server show \
          --resource-group "${AZURE_RESOURCE_GROUP}" \
          --name "${AZURE_SQL_SERVER}" \
          --query "{name:name,fqdn:fullyQualifiedDomainName,publicNetworkAccess:publicNetworkAccess,state:state}" \
          --output table

        az sql db show \
          --resource-group "${AZURE_RESOURCE_GROUP}" \
          --server "${AZURE_SQL_SERVER}" \
          --name "${AZURE_SQL_DATABASE}" \
          --query "{name:name,status:status,computeModel:computeModel,autoPauseDelay:autoPauseDelay,minCapacity:minCapacity,capacity:sku.capacity,sku:sku.name,tier:sku.tier,family:sku.family,freeLimitExhaustionBehavior:freeLimitExhaustionBehavior,zoneRedundant:zoneRedundant}" \
          --output table

    - name: Show recent application logs
      continue-on-error: true
      run: |
        az containerapp logs show \
          --resource-group "${AZURE_RESOURCE_GROUP}" \
          --name "${AZURE_CONTAINER_APP}" \
          --tail 200

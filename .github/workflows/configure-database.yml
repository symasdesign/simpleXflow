name: Configure Azure database

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Database provider to configure"
        required: true
        default: Postgres
        type: choice
        options:
        - Postgres

permissions:
  contents: read
  id-token: write

env:
  AZURE_RESOURCE_GROUP: rg-simplexflow
  AZURE_CONTAINER_APP: ca-simplexflow
  AZURE_CLIENT_ID: c84a2dc1-e98e-4946-8c68-f084e646fe10
  AZURE_TENANT_ID: 11a68f50-2c95-46d1-b23a-4f2866f69143
  AZURE_SUBSCRIPTION_ID: c3a51299-7014-4440-9741-1f6f9828b745

jobs:
  configure:
    name: Configure selected database provider
    runs-on: ubuntu-latest

    steps:
    - name: Validate required secret
      shell: bash
      env:
        POSTGRES_CONNECTION_STRING: ${{ secrets.POSTGRES_CONNECTION_STRING }}
      run: |
        if [ -z "${POSTGRES_CONNECTION_STRING}" ]; then
          echo "POSTGRES_CONNECTION_STRING repository secret is required." >&2
          exit 1
        fi

    - name: Log in to Azure
      uses: azure/login@v2
      with:
        client-id: ${{ env.AZURE_CLIENT_ID }}
        tenant-id: ${{ env.AZURE_TENANT_ID }}
        subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

    - name: Configure PostgreSQL
      shell: bash
      env:
        POSTGRES_CONNECTION_STRING: ${{ secrets.POSTGRES_CONNECTION_STRING }}
      run: |
        az containerapp secret set \
          --resource-group "${AZURE_RESOURCE_GROUP}" \
          --name "${AZURE_CONTAINER_APP}" \
          --secrets postgres-connection-string="${POSTGRES_CONNECTION_STRING}"

        az containerapp update \
          --resource-group "${AZURE_RESOURCE_GROUP}" \
          --name "${AZURE_CONTAINER_APP}" \
          --set-env-vars \
            Database__Provider=Postgres \
            ConnectionStrings__DefaultConnection=secretref:postgres-connection-string

    - name: Show live database setting
      run: |
        az containerapp show \
          --resource-group "${AZURE_RESOURCE_GROUP}" \
          --name "${AZURE_CONTAINER_APP}" \
          --query "properties.template.containers[0].env[?name=='Database__Provider' || name=='ConnectionStrings__DefaultConnection'].{name:name,value:value,secretRef:secretRef}" \
          --output table

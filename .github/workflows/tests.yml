name: Tests

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: .NET and browser regression tests
    # Keep browser dependencies on an OS supported by the pinned Playwright version.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - name: Run complete test suite
      shell: pwsh
      run: ./scripts/test.ps1 -InstallBrowsers
    - name: Upload test reports and failure traces
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        retention-days: 14
        path: |
          artifacts/test-results/**
          artifacts/browser/bridge-results/**
          artifacts/browser/bridge-report/**
          artifacts/browser/e2e-results/**
          artifacts/browser/e2e-report/**

name: Build, test, and deploy simpleXflow

on:
  push:
    branches:
    - main
    - master
  workflow_dispatch:

env:
  DOTNET_VERSION: 10.0.x
  BUILD_CONFIGURATION: Release
  WEB_PROJECT: src/SimpleXflow.Web/SimpleXflow.Web.csproj
  AZURE_WEBAPP_NAME: simplexflow

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore
      run: dotnet restore simpleXflow.slnx

    - name: Build
      run: dotnet build simpleXflow.slnx --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

    - name: Test
      run: dotnet test simpleXflow.slnx --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --logger trx --results-directory test-results

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: test-results/*.trx

    - name: Publish web app
      run: dotnet publish ${{ env.WEB_PROJECT }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --output publish

    - name: Upload web artifact
      uses: actions/upload-artifact@v4
      with:
        name: simplexflow-web
        path: publish

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
    - name: Download web artifact
      uses: actions/download-artifact@v4
      with:
        name: simplexflow-web
        path: publish

    - name: Deploy to Azure App Service
      id: deploy
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: publish

name: Build, test, and deploy simpleXflow

on:
  push:
    branches:
    - main
    - master
  workflow_dispatch:

env:
  DOTNET_VERSION: 10.0.x
  BUILD_CONFIGURATION: Release
  WEB_PROJECT: src/SimpleXflow.Web/SimpleXflow.Web.csproj
  AZURE_WEBAPP_NAME: simplexflow
  AZURE_WEBAPP_URL: https://simplexflow-c7b7bmf9h9ene3by.switzerlandnorth-01.azurewebsites.net

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore
      run: dotnet restore simpleXflow.slnx

    - name: Build
      run: dotnet build simpleXflow.slnx --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

    - name: Test
      run: dotnet test simpleXflow.slnx --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --logger trx --results-directory test-results

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: test-results/*.trx

    - name: Publish web app
      run: dotnet publish ${{ env.WEB_PROJECT }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --output publish

    - name: Upload web artifact
      uses: actions/upload-artifact@v4
      with:
        name: simplexflow-web
        path: publish

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ env.AZURE_WEBAPP_URL }}

    steps:
    - name: Download web artifact
      uses: actions/download-artifact@v4
      with:
        name: simplexflow-web
        path: publish

    - name: Deploy to Azure App Service
      id: deploy
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: publish

    - name: Recycle App Service process
      shell: pwsh
      env:
        PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
      run: |
        [xml]$publishProfile = $env:PUBLISH_PROFILE
        $profile = $publishProfile.publishData.publishProfile |
          Where-Object { $_.publishMethod -eq "MSDeploy" } |
          Select-Object -First 1

        if ($null -eq $profile) {
          throw "The publish profile does not contain an MSDeploy profile."
        }

        $publishHost = ($profile.publishUrl -replace "^https?://", "").Split("/")[0]
        $kuduBaseUrl = "https://$publishHost"
        $credentials = "{0}:{1}" -f $profile.userName, $profile.userPWD
        $encodedCredentials = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($credentials))
        $headers = @{ Authorization = "Basic $encodedCredentials" }
        $body = @{
          command = "powershell -NoProfile -ExecutionPolicy Bypass -Command ""(Get-Item 'D:\home\site\wwwroot\web.config').LastWriteTimeUtc = [DateTime]::UtcNow"""
          dir = "D:\home\site\wwwroot"
        } | ConvertTo-Json

        Invoke-RestMethod -Uri "$kuduBaseUrl/api/command" -Method Post -Headers $headers -ContentType "application/json" -Body $body

    - name: Wait for application startup
      shell: pwsh
      run: |
        $url = "${{ env.AZURE_WEBAPP_URL }}"
        $lastError = $null

        for ($attempt = 1; $attempt -le 24; $attempt++) {
          try {
            $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 15
            if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 500) {
              Write-Host "Application responded with HTTP $($response.StatusCode)."
              exit 0
            }

            $lastError = "Unexpected HTTP status $($response.StatusCode)."
          }
          catch {
            $lastError = $_.Exception.Message
          }

          Write-Host "Application is not ready yet. Attempt $attempt/24. $lastError"
          Start-Sleep -Seconds 10
        }

        throw "Application did not become ready. Last error: $lastError"
